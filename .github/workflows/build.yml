name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Ozeryn-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: cd ozeryn && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ozeryn
          path: ozeryn/build/libs/Ozeryn-1.0.0.jar
